name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "35 18 * * *"   # 00:05 IST daily, so "today" and freshness ranking roll over even without new edits

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so pages carry real update times from git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (share images)
        run: pip install pillow
      - name: Check data (stops the deploy on errors; warnings are listed only)
        run: python3 check.py
      - name: Build
        run: python3 build.py
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: newspinapp.com
          commit_message: "Publish ${{ github.sha }}"
      - name: Notify IndexNow (Bing and others) of changed pages
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sleep 90   # give GitHub Pages time to serve the new build and key file
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- data/stories 2>/dev/null || true)
          python3 indexnow.py $CHANGED
